const grupos = [];
let grupoActual = null;

function grupo(nombre) {
  grupoActual = { nombre, pruebas: [] };
  grupos.push(grupoActual);
}

function prueba(nombre, fn) {
  try {
    fn();
    grupoActual.pruebas.push({ nombre, ok: true });
  } catch (e) {
    grupoActual.pruebas.push({ nombre, ok: false, msg: e.message });
  }
}

function igual(real, esperado, que) {
  const iguales = (typeof esperado === 'object' && esperado !== null)
    ? JSON.stringify(real) === JSON.stringify(esperado)
    : Object.is(real, esperado);
  if (!iguales) {
    throw new Error((que ? que + ': ' : '') + 'esperado ' + mostrar(esperado) + ', recibido ' + mostrar(real));
  }
}

function cierto(condicion, que) {
  if (!condicion) throw new Error(que);
}

function conErrores(lista, que) {
  cierto(Array.isArray(lista), (que || '') + ' no devuelve una lista de errores');
  cierto(lista.length > 0, (que || '') + ' debería tener errores y no tiene');
}

function sinErrores(lista, que) {
  cierto(Array.isArray(lista), (que || '') + ' no devuelve una lista de errores');
  cierto(lista.length === 0, (que || '') + ' no debería tener errores: ' + JSON.stringify(lista));
}

function mostrar(v) {
  if (typeof v === 'number' && Number.isNaN(v)) return 'NaN';
  if (typeof v === 'string') return '"' + v + '"';
  return JSON.stringify(v);
}

/**
 * Crea una partida normalizada a partir de un marcador escrito como texto.
 * P('6-4 6-3 5-3')   → tres sets
 * P('6-4 _ 6-3')     → el set 2 vacío
 * P('6-')            → set 1 con solo los juegos de A
 * extra sobrescribe cualquier campo.
 */
function P(marcador, extra) {
  const p = {
    id_partida: '20261105-1', fecha: '2026-11-05', estado: 'finalizada',
    a1: 'J01', a2: 'J02', b1: 'J03', b2: 'J04',
    s1_a: null, s1_b: null, s2_a: null, s2_b: null, s3_a: null, s3_b: null,
    incluye_invitado: false, origen: 'app', notas: '', actualizado_en: ''
  };
  (marcador ? marcador.trim().split(/\s+/) : []).forEach((s, i) => {
    if (s === '_') return;
    const [a, b] = s.split('-');
    p['s' + (i + 1) + '_a'] = a === '' ? null : Number(a);
    p['s' + (i + 1) + '_b'] = b === '' ? null : Number(b);
  });
  return Object.assign(p, extra || {});
}

      if (!p.ok) { fallos++; fallosGrupo++; }
      const li = document.createElement('li');
      li.className = p.ok ? 'ok' : 'fallo';
      li.textContent = p.nombre;
      if (!p.ok) {
        const m = document.createElement('span');
        m.className = 'msg';
        m.textContent = p.msg;
        li.appendChild(m);
      }
      ul.appendChild(li);
    });
    h.textContent = g.nombre + ' (' + (g.pruebas.length - fallosGrupo) + '/' + g.pruebas.length + ')';
    salida.appendChild(h);
    salida.appendChild(ul);
  });
  const resumen = document.getElementById('resumen');
  resumen.textContent = (total - fallos) + ' de ' + total + ' pruebas correctas';
  resumen.className = fallos ? 'hay-fallos' : 'todo-ok';
})();
</script>
</body>
</html>
